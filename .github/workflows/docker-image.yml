
name: ShaadiExpress AWS ECR CI/CD

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:

  # =========================
  # CI: BUILD AND TEST
  # =========================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore ShaadiExpress.sln

      - name: Build Application
        run: dotnet build ShaadiExpress.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test ShaadiExpress.sln -c Release --no-build

      - name: Build Docker Image
        run: docker build -t shaadiexpress:test .

  # =========================
  # CI: PUSH IMAGE TO AWS ECR
  # =========================
  push-image:
    name: Push Image to AWS ECR
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  # =========================
  # CD: DEPLOY TO AWS EC2
  # =========================
  deploy:
    name: Deploy to AWS EC2
    needs: push-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2

        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,IMAGE_TAG

          script: |
            set -e

            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            echo "Login to AWS ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            echo "Pulling new image..."

            docker pull "$IMAGE"

            echo "Stopping old application..."

            docker stop dotnet-api || true
            docker rm dotnet-api || true

            echo "Starting new application..."

            docker run -d \
              --name dotnet-api \
              --restart unless-stopped \
              --env-file /opt/myapp/.env \
              -p 80:8080 \
              "$IMAGE"

            echo "Deployment successful!"

            docker image prune -f
